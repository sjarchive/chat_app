name: Supabase keep-alive

# Free-tier Supabase projects auto-pause after 7 days with no API activity.
# Running this every 4 days (instead of weekly) leaves margin in case a
# scheduled run gets skipped or delayed, as GitHub occasionally does.
#
# URL and anon key are the same public values already committed in
# public/supabase-config.js — the anon key is meant to be public, so no
# repo secrets are needed here.
on:
  schedule:
    - cron: "0 6 */4 * *"
  workflow_dispatch: {} # lets you trigger a run manually from the Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Hit a lightweight REST endpoint
        run: |
          curl --fail --silent --show-error \
            "https://bkobrmfarfivxjzcpqbd.supabase.co/rest/v1/profiles?select=id&limit=1" \
            -H "apikey: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJrb2JybWZhcmZpdnhqemNwcWJkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODkwNTkzMDIsImV4cCI6MjEwNDYzNTMwMn0.QLdTquI8qQvqPrt1NWLOEV2hL3p_cc5s2dAGLiad0xk" \
            -H "Authorization: Bearer eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJrb2JybWZhcmZpdnhqemNwcWJkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODkwNTkzMDIsImV4cCI6MjEwNDYzNTMwMn0.QLdTquI8qQvqPrt1NWLOEV2hL3p_cc5s2dAGLiad0xk"

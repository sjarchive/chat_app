<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<script>
  // Apply the saved theme before first paint, so there's no flash of the wrong theme.
  (function () {
    try {
      var t = localStorage.getItem("circle-theme") || "dark";
      document.documentElement.setAttribute("data-theme", t);
    } catch (e) {}
  })();
</script>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
<title>Circle</title>
<link rel="manifest" href="/manifest.json" />
<meta name="theme-color" content="#0E1116" />
<link rel="stylesheet" href="/style.css" />
<style>
  .password-field { position: relative; width: 100%; }
  .password-field #auth-password { padding-right: 48px; width: 100%; box-sizing: border-box; }
  .password-toggle {
    position: absolute; right: 10px; top: 50%; transform: translateY(-50%);
    width: 36px; height: 36px; padding: 0; border: 0; background: transparent;
    color: inherit; display: flex; align-items: center; justify-content: center;
    cursor: pointer; opacity: 0.75;
  }
  .password-toggle:hover, .password-toggle:focus-visible { opacity: 1; }
  .password-toggle:focus-visible { outline: 2px solid currentColor; outline-offset: 2px; border-radius: 6px; }
</style>
</head>
<body>

  <!-- AUTH SCREEN -->
  <div id="auth-screen" class="screen">
    <div class="auth-card">
      <h1 class="auth-title">Circle</h1>
      <p class="auth-sub">One group. Everyone's in it.</p>

      <form id="auth-form">
        <input id="auth-fullname" class="hidden" type="text" placeholder="Name" autocomplete="name" maxlength="20" />
        <input id="auth-name" type="text" placeholder="Username" autocomplete="username" minlength="5" maxlength="10" required />
        <div class="password-field">
          <input id="auth-password" type="password" placeholder="Password" autocomplete="current-password" minlength="8" maxlength="20" required />
          <button type="button" id="password-toggle" class="password-toggle" aria-label="Show password" aria-pressed="false">
            <svg id="password-toggle-icon" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"></path>
              <circle cx="12" cy="12" r="3"></circle>
            </svg>
          </button>
        </div>
        <button type="submit" id="auth-submit">Sign in</button>
      </form>

      <button id="auth-toggle" class="link-button">Need an account? Sign up</button>
      <p id="auth-error" class="auth-error"></p>
    </div>
  </div>

  <!-- CHAT SCREEN -->
  <div id="chat-screen" class="screen hidden">
    <header class="chat-header">
      <div class="chat-header-info">
        <span class="chat-title">Circle</span>
        <span class="chat-sub" id="member-count">—</span>
      </div>
      <div class="header-actions">
        <button type="button" id="theme-toggle" class="icon-button" aria-label="Toggle theme">
          <svg id="theme-icon" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg>
        </button>
        <button id="sign-out" class="icon-button" aria-label="Sign out">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18.36 6.64a9 9 0 1 1-12.73 0"/><line x1="12" y1="2" x2="12" y2="12"/></svg>
        </button>
      </div>
    </header>

    <main id="message-list" class="message-list"></main>

    <div id="jump-bottom" class="jump-bottom hidden" aria-label="Jump to latest messages">↓ <span id="jump-bottom-count"></span></div>

    <div id="typing-indicator" class="typing-indicator hidden"></div>

    <div id="reply-preview" class="reply-preview hidden">
      <div class="reply-preview-info">
        <span id="reply-preview-name" class="reply-preview-name"></span>
        <span id="reply-preview-text" class="reply-preview-text"></span>
      </div>
      <button type="button" id="reply-preview-cancel" class="icon-button" aria-label="Cancel reply">✕</button>
    </div>

    <form id="composer" class="composer">
      <button type="button" id="attach-button" class="icon-button" aria-label="Attach media">📎</button>
      <input id="attach-input" type="file" accept="image/*" class="hidden-field" />
      <input id="message-input" type="text" placeholder="Message" autocomplete="off" />
      <button type="submit" id="send-button" class="send-button" aria-label="Send">➤</button>
    </form>
  </div>

  <script>
    // If a Supabase session is already persisted in localStorage, show the chat
    // screen immediately instead of the auth screen, so there's no flash of the
    // sign-in page on refresh while real session validation happens below.
    // (Mirrors the theme flash-prevention script at the top of <head>.)
    (function () {
      try {
        var hasSession = Object.keys(localStorage).some(function (key) {
          return key.indexOf("sb-") === 0 && key.indexOf("-auth-token") !== -1 && localStorage.getItem(key);
        });
        if (hasSession) {
          document.getElementById("auth-screen").classList.add("hidden");
          document.getElementById("chat-screen").classList.remove("hidden");
        }
      } catch (e) {}
    })();
  </script>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="/supabase-config.js"></script>
  <script src="/script.js"></script>
</body>
</html>

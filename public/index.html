<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<script>
  // Apply the saved theme, and mark whether a session looks logged-in, before
  // first paint - so there's no flash of the wrong theme or of the barebone
  // auth screen. This has to run in <head>, before the body's HTML is even
  // parsed, and the has-session result has to be applied via CSS (not a
  // script later in <body>) so there's no moment where the auth screen can
  // get painted un-hidden first. Real session validation still happens in
  // script.js; this only prevents the flash while that check runs.
  (function () {
    try {
      var t = localStorage.getItem("circle-theme") || "dark";
      document.documentElement.setAttribute("data-theme", t);
      var hasSession = Object.keys(localStorage).some(function (key) {
        return key.indexOf("sb-") === 0 && key.indexOf("-auth-token") !== -1 && localStorage.getItem(key);
      });
      if (hasSession) document.documentElement.classList.add("has-session");
      // If a conversation was open when the page was last refreshed, mark
      // that too, so the CSS below can pre-paint the chat screen straight
      // away instead of flashing the chats list first.
      if (hasSession && sessionStorage.getItem("circle-open-chat")) {
        document.documentElement.classList.add("has-open-chat");
      }
    } catch (e) {}
  })();
</script>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
<title>Circle</title>
<link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
<link rel="apple-touch-icon" href="/icon-192.png" />
<link rel="manifest" href="/manifest.json" />
<meta name="theme-color" content="#0E1116" />
<!-- Inlined rather than linked: Firefox can paint the page before a separate
     stylesheet request resolves (notably on reload, while revalidating the
     cached file), which shows the bare unstyled HTML for a split second.
     With the CSS inside the document, the first paint is always styled. -->
<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  /* Suppresses the default mobile blue/gray tap-highlight box that Chrome
     and Safari flash on any tappable element when it's tapped. */
  -webkit-tap-highlight-color: transparent;
}

:root {
  --bg: #0E1116;
  --surface: #1B2028;
  --surface-2: #232A34;
  --mine-bg: #1F6F5C;
  --mine-text: #FFFFFF;
  --theirs-bg: #232A34;
  --theirs-text: #E9EDF1;
  --text: #E9EDF1;
  --text-dim: #6B7480;
  --accent: #E0A72E;
  --accent-text: #1B1300;
  --danger: #C4574B;
  --border: #232A34;
}

/* WhatsApp-style light theme */
[data-theme="light"] {
  --bg: #ECE5DD;
  --surface: #FFFFFF;
  --surface-2: #FFFFFF;
  --mine-bg: #DCF8C6;
  --mine-text: #111B21;
  --theirs-bg: #FFFFFF;
  --theirs-text: #111B21;
  --text: #111B21;
  --text-dim: #667781;
  --accent: #00A884;
  --accent-text: #FFFFFF;
  --danger: #C4574B;
  --border: #E9EDEF;
}

html, body {
  height: 100%;
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  -webkit-font-smoothing: antialiased;
  /* Telegram-ish default scale: everything in rem/em below inherits this */
  font-size: 16.5px;
}

/* Slim, unobtrusive scrollbars (Telegram-style) */
::-webkit-scrollbar { width: 5px; height: 5px; }
::-webkit-scrollbar-thumb { background: rgba(127,127,127,0.35); border-radius: 3px; }
::-webkit-scrollbar-thumb:hover { background: rgba(127,127,127,0.55); }
::-webkit-scrollbar-track { background: transparent; }
* { scrollbar-width: thin; scrollbar-color: rgba(127,127,127,0.35) transparent; }

/* Smooth light/dark cross-fade: the theme swaps CSS variables on <html>, and
   variables themselves can't animate — but the properties consuming them do,
   when the element has a transition for them. Rule order matters: every
   element gets these theme-property transitions by default; rules that need
   a different transition (html/body below, .reply-trigger, .jump-bottom…)
   come later or carry higher specificity, so they still win. */
@media (prefers-reduced-motion: no-preference) {
  * {
    transition: background-color 0.3s ease, color 0.3s ease,
                border-color 0.3s ease;
    /* box-shadow deliberately NOT transitioned: in light theme every message
       bubble carries a box-shadow, so animating it re-renders (not just
       repaints) hundreds of bubbles per frame inside a long conversation —
       that's what made the toggle stutter on the chat screen. The shadow
       now swaps instantly instead of fading, which is imperceptible. */
  }
  html, body { transition: background-color 0.3s ease, color 0.3s ease; }
}

.hidden { display: none !important; }
.hidden-field { display: none; }

.screen { height: 100dvh; height: calc(var(--app-height, 100dvh)); display: flex; flex-direction: column; position: relative; transform: translateY(var(--app-offset-top, 0px)); }

/* ---------- Auth ---------- */
#auth-screen { align-items: center; justify-content: center; padding: 24px; }

.auth-card { width: 100%; max-width: 380px; text-align: center; }

.auth-title { font-size: 36px; font-weight: 700; letter-spacing: -0.03em; margin-bottom: 4px; }
.auth-sub { color: var(--text-dim); font-size: 15px; margin-bottom: 28px; }

#auth-form { display: flex; flex-direction: column; gap: 11px; }

#auth-form input {
  background: var(--surface-2);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 14px 15px;
  color: var(--text);
  font-size: 16px;
  outline: none;
  transition: border-color 0.15s ease, background-color 0.3s ease;
}
#auth-form input:focus { border-color: var(--accent); }

#auth-submit {
  background: var(--accent);
  color: var(--accent-text);
  border: none;
  border-radius: 12px;
  padding: 14px;
  font-size: 16px;
  font-weight: 600;
  cursor: pointer;
  margin-top: 6px;
}
#auth-submit:hover { filter: brightness(1.05); }
#auth-submit:active { opacity: 0.85; }

.link-button {
  background: none;
  border: none;
  color: var(--accent);
  font-size: 14px;
  margin-top: 18px;
  cursor: pointer;
}
.link-button:hover { text-decoration: underline; }

.auth-error { color: var(--danger); font-size: 13px; margin-top: 12px; min-height: 16px; }

/* ---------- Chat ---------- */
.chat-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 12px 14px;
  padding-top: max(12px, env(safe-area-inset-top));
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
}
.chat-header-info { display: flex; flex-direction: column; }
.chat-title { font-size: 19px; font-weight: 600; letter-spacing: -0.01em; }
.chat-sub { font-size: 13px; color: var(--text-dim); }

.header-actions { display: flex; align-items: center; gap: 2px; }

.icon-button {
  background: none;
  border: none;
  color: var(--text-dim);
  font-size: 19px;
  cursor: pointer;
  padding: 8px;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 50%;
}
.icon-button:hover { color: var(--text); background: rgba(127,127,127,0.12); }
.icon-button:active { background: rgba(127,127,127,0.2); }
.icon-button svg { display: block; }

.message-list {
  flex: 1;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  padding: 16px 14px;
  display: flex;
  flex-direction: column;
  gap: 2px;
  position: relative;
}

.msg-row { display: flex; margin-bottom: 2px;
  /* Skips rendering work for rows scrolled out of view. A long conversation
     only paints the visible bubbles — this is what keeps both the initial
     render after a refresh and the theme cross-fade cheap as history grows.
     "auto 44px" lets the browser memoize each row's real height once
     rendered, so the scrollbar stays accurate. */
  content-visibility: auto;
  contain-intrinsic-size: auto 44px; }
.msg-row.grouped { margin-bottom: 2px; }
.msg-row.group-start { margin-top: 10px; }
.msg-row.mine { justify-content: flex-end; }
.msg-row.theirs { justify-content: flex-start; }

.bubble {
  max-width: min(74%, 440px);
  padding: 9px 13px;
  border-radius: 14px;
  font-size: 16px;
  line-height: 1.4;
  word-wrap: break-word;
  box-shadow: 0 1px 1px rgba(11, 20, 26, 0.14);
}
.mine .bubble { background: var(--mine-bg); color: var(--mine-text); border-bottom-right-radius: 6px; }
.theirs .bubble { background: var(--theirs-bg); color: var(--theirs-text); border-bottom-left-radius: 6px; }

/* Tighten the tail-corner only on the last bubble of a consecutive group */
.mine .bubble { border-radius: 14px; }
.theirs .bubble { border-radius: 14px; }
.msg-row.mine.group-last .bubble { border-bottom-right-radius: 6px; }
.msg-row.theirs.group-last .bubble { border-bottom-left-radius: 6px; }

[data-theme="light"] .bubble { box-shadow: 0 1px 1px rgba(11, 20, 26, 0.13); }
[data-theme="dark"] .bubble { box-shadow: 0 1px 1.5px rgba(0, 0, 0, 0.3); }

.bubble .sender-name {
  display: block;
  font-size: 13px;
  font-weight: 600;
  color: var(--accent);
  margin-bottom: 2px;
}

.bubble .meta {
  display: flex;
  align-items: center;
  justify-content: flex-end;
  gap: 4px;
  font-size: 11px;
  color: rgba(255,255,255,0.55);
  margin-top: 3px;
}
.theirs .bubble .meta { color: var(--text-dim); }
[data-theme="light"] .mine .bubble .meta { color: rgba(17,27,33,0.55); }

.bubble .meta .tick { font-size: 12px; letter-spacing: -1px; }
.bubble .meta .tick.seen { color: #53BDEB; letter-spacing: -2px; }
.bubble .meta .tick.pending { opacity: 0.5; }

.bubble img.media {
  max-width: 100%;
  border-radius: 10px;
  display: block;
  margin-bottom: 4px;
  cursor: pointer;
}

.media-file {
  display: block;
  margin-bottom: 4px;
  padding: 9px 13px;
  border-radius: 10px;
  background: rgba(127, 127, 127, 0.15);
  color: inherit;
  text-decoration: none;
  font-size: 15px;
}

/* ---------- Reply-to ---------- */
.msg-row { align-items: flex-end; }

.reply-trigger {
  background: none;
  border: none;
  color: var(--text-dim);
  font-size: 22px;
  line-height: 1;
  cursor: pointer;
  box-sizing: border-box;
  padding: 0; /* padding only appears when revealed — border-box can't shrink below its own padding, so a fixed padding here would keep reserving space even at width:0 */
  width: 0; /* collapsed at rest — reserves no space, so bubbles stay flush to the edge */
  min-width: 0; /* flex items default to min-width:auto, which ignores width:0 when there's content */
  overflow: hidden;
  opacity: 0; /* revealed by hover (desktop) or swipe (mobile, via JS) */
  flex-shrink: 0;
  -webkit-tap-highlight-color: transparent; /* no blue flash on tap/long-press */
  /* width/padding/opacity drive the swipe reveal; background-color/color are
     added so this rule's transition list doesn't override (and thus drop) the
     theme cross-fade the universal * rule sets for everything else. */
  transition: width 0.18s ease, padding 0.18s ease, opacity 0.15s ease,
              background-color 0.3s ease, color 0.3s ease;
}
.reply-trigger:focus { outline: none; }
.reply-trigger:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* Desktop / mouse: reveal on hover over the row */
@media (hover: hover) and (pointer: fine) {
  /* "mine" rows: put the icon before the bubble visually (DOM order stays
     the same, so mobile's swipe/overlap logic isn't affected) so the
     bubble — not the icon — is the item anchored to the row's edge, and
     stays put on hover instead of shifting left. */
  .msg-row.mine .reply-trigger { order: -1; }

  .msg-row:hover .reply-trigger { width: 34px; padding: 6px; opacity: 0.55; }
  .reply-trigger:hover { opacity: 1; }
}

/* Touch devices: no hover affordance, so make the tap target bigger */
@media (hover: none) and (pointer: coarse) {
  .reply-trigger { font-size: 26px; }
}

/* Desktop click feedback: bubble + icon nudge left together, then settle
   back, so clicking the reply icon reads as a deliberate little "punch"
   rather than an instant no-op. Transform-based (not the flex reflow used
   at rest) so it applies the same way to mine and theirs rows. */
@keyframes reply-bounce {
  0% { transform: translateX(0); }
  35% { transform: translateX(-8px); }
  100% { transform: translateX(0); }
}
.msg-row.reply-bounce .bubble,
.msg-row.reply-bounce .reply-trigger {
  animation: reply-bounce 0.22s ease;
}

/* Let JS own horizontal swipe gestures while still allowing normal vertical scroll. */
.bubble { touch-action: pan-y; }

.quoted-msg {
  display: flex;
  flex-direction: column;
  gap: 1px;
  border-left: 3px solid var(--accent);
  background: rgba(127, 127, 127, 0.15);
  border-radius: 6px;
  padding: 5px 9px;
  margin-bottom: 6px;
  cursor: pointer;
  max-width: 100%;
}
.quoted-msg:hover { background: rgba(127, 127, 127, 0.22); }
.quoted-name { font-size: 13px; font-weight: 600; color: var(--accent); }
.quoted-body {
  font-size: 14px;
  color: var(--text-dim);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.mine .quoted-body { color: rgba(255,255,255,0.75); }
[data-theme="light"] .mine .quoted-body { color: rgba(17,27,33,0.6); }

.msg-row.highlight-flash .bubble { animation: flash 1.2s ease-out; }
@keyframes flash {
  0% { box-shadow: 0 0 0 2px var(--accent); }
  100% { box-shadow: none; }
}

.reply-preview {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  padding: 8px 12px;
  background: var(--surface);
  border-top: 1px solid var(--border);
  border-left: 3px solid var(--accent);
  flex-shrink: 0;
}
.reply-preview-info { display: flex; flex-direction: column; gap: 1px; min-width: 0; }
.reply-preview-name { font-size: 13px; font-weight: 600; color: var(--accent); }
.reply-preview-text {
  font-size: 14px;
  color: var(--text-dim);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.day-divider {
  align-self: center;
  color: var(--text);
  background: rgba(127, 127, 127, 0.18);
  border-radius: 13px;
  padding: 4px 12px;
  font-size: 13px;
  font-weight: 500;
  margin: 14px 0 8px;
}

.typing-indicator {
  font-size: 13px;
  color: var(--text-dim);
  font-style: italic;
}

/* ---------- Chats list ---------- */
.chat-header .chat-header-info { min-width: 0; }
#back-button { margin-right: 4px; }

.search-bar {
  position: relative;
  padding: 8px 12px 10px;
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
}
#user-search {
  width: 100%;
  background: var(--surface-2);
  border: 1px solid var(--border);
  border-radius: 20px;
  padding: 11px 17px;
  color: var(--text);
  font-size: 15px;
  outline: none;
  transition: border-color 0.15s ease, background-color 0.3s ease;
}
#user-search:focus { border-color: var(--accent); }

.search-results {
  position: absolute;
  left: 12px;
  right: 12px;
  top: calc(100% - 6px);
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 14px;
  box-shadow: 0 8px 28px rgba(0,0,0,0.3);
  z-index: 20;
  overflow: hidden;
}
.search-result {
  display: flex;
  flex-direction: column;
  gap: 1px;
  padding: 11px 15px;
  cursor: pointer;
}
.search-result:hover, .search-result:active { background: var(--surface-2); }
.search-result-name { font-size: 16px; }
.search-result-username { font-size: 13px; color: var(--text-dim); }
.search-empty { padding: 11px 15px; font-size: 14px; color: var(--text-dim); }

.chat-list {
  flex: 1;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  background: var(--bg);
  display: flex;
  flex-direction: column;
  gap: 5px;
  padding: 5px;
}
.chat-item {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 12px 14px;
  cursor: pointer;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 14px;
  box-shadow: 0 1px 2px rgba(0,0,0,0.08);
}
.chat-item:hover { filter: brightness(1.04); }
.chat-item:active { filter: brightness(0.96); }
.chat-item-info { flex: 1; min-width: 0; }
.chat-item-top {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  gap: 8px;
}
.chat-item-name { font-size: 16px; font-weight: 600; }
.chat-item-time { font-size: 13px; color: var(--text-dim); flex-shrink: 0; }
.chat-item-bottom {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 8px;
}
.chat-item-preview {
  font-size: 14px;
  color: var(--text-dim);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.chat-item-preview .tick {
  margin-right: 4px;
  color: var(--text-dim);
}
.chat-item-preview .tick.seen { color: #53BDEB; letter-spacing: -2px; }

.chat-item-badge {
  background: var(--accent);
  color: var(--accent-text);
  border-radius: 12px;
  min-width: 22px;
  height: 22px;
  padding: 0 6px;
  font-size: 13px;
  font-weight: 600;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}
.chat-list-empty {
  padding: 40px 24px;
  text-align: center;
  color: var(--text-dim);
  font-size: 15px;
}

.jump-bottom {
  position: absolute;
  right: 20px;
  bottom: 78px;
  background: var(--surface-2);
  color: var(--text);
  border: 1px solid var(--border);
  border-radius: 20px;
  padding: 8px 14px;
  font-size: 14px;
  cursor: pointer;
  box-shadow: 0 4px 14px rgba(0,0,0,0.3);
  display: flex;
  align-items: center;
  gap: 4px;
  z-index: 5;
}
.jump-bottom:hover { filter: brightness(1.08); }
#jump-bottom-count:empty { display: none; }

/* ---------- Composer ---------- */
.composer-error {
  padding: 6px 16px;
  font-size: 14px;
  color: var(--danger);
  background: var(--surface);
  border-top: 1px solid var(--border);
  flex-shrink: 0;
}

.composer {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 9px 10px;
  padding-bottom: max(9px, env(safe-area-inset-bottom));
  background: var(--surface);
  border-top: 1px solid var(--border);
  flex-shrink: 0;
}

#message-input {
  flex: 1;
  background: var(--surface-2);
  border: 1px solid transparent;
  border-radius: 22px;
  padding: 12px 17px;
  color: var(--text);
  font-size: 16px;
  outline: none;
  transition: border-color 0.15s ease, background-color 0.3s ease;
}
#message-input:focus { border-color: var(--accent); }
[data-theme="light"] #message-input { border: 1px solid var(--border); }
[data-theme="light"] #message-input:focus { border-color: var(--accent); }

.send-button {
  background: var(--accent);
  border: none;
  color: var(--accent-text);
  width: 42px;
  height: 42px;
  border-radius: 50%;
  font-size: 16px;
  cursor: pointer;
  flex-shrink: 0;
  box-shadow: 0 2px 6px rgba(0,0,0,0.2);
}
.send-button:hover { filter: brightness(1.05); }
.send-button:active { opacity: 0.85; transform: scale(0.95); }

@media (prefers-reduced-motion: no-preference) {
  /* Only on rows arriving live while the chat is open (.animate-in is added
     by JS). Applying it to .msg-row itself made the ENTIRE history replay the
     animation whenever it was re-rendered — most visibly right after a page
     refresh, where the whole list visibly flickered/jittered into place. */
  .msg-row.animate-in { animation: rise 0.15s ease-out; }
}
@keyframes rise {
  from { opacity: 0; transform: translateY(4px); }
  to { opacity: 1; transform: translateY(0); }
}

/* ---------- Settings modal ---------- */
.settings-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0, 0, 0, 0.55);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 24px;
  z-index: 10;
}
.settings-card {
  width: 100%;
  max-width: 380px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 18px;
  padding: 24px;
  box-shadow: 0 12px 40px rgba(0,0,0,0.35);
}
.settings-card h2 { font-size: 20px; font-weight: 600; margin-bottom: 14px; }
.settings-label { display: block; font-size: 14px; color: var(--text-dim); margin-bottom: 6px; }
.settings-hint { font-size: 13px; color: var(--text-dim); margin-bottom: 10px; }
#settings-name {
  width: 100%;
  background: var(--surface-2);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 13px 14px;
  color: var(--text);
  font-size: 16px;
  outline: none;
  transition: border-color 0.15s ease, background-color 0.3s ease;
}
#settings-name:focus { border-color: var(--accent); }
.settings-actions { display: flex; justify-content: flex-end; align-items: center; gap: 10px; margin-top: 16px; }
.settings-actions .link-button { margin-top: 0; }
#settings-save {
  background: var(--accent);
  color: var(--accent-text);
  border: none;
  border-radius: 12px;
  padding: 11px 24px;
  font-size: 15px;
  font-weight: 600;
  cursor: pointer;
}
#settings-save:hover { filter: brightness(1.05); }
#settings-save:active { opacity: 0.85; }
#settings-save:disabled { opacity: 0.6; cursor: default; }

/* ---------- Auth-screen password toggle (page-specific) ---------- */
.password-field { position: relative; width: 100%; }
  .password-field #auth-password { padding-right: 48px; width: 100%; box-sizing: border-box; }
  .password-toggle {
    position: absolute; right: 10px; top: 50%; transform: translateY(-50%);
    width: 36px; height: 36px; padding: 0; border: 0; background: transparent;
    color: inherit; display: flex; align-items: center; justify-content: center;
    cursor: pointer; opacity: 0.75;
  }
  .password-toggle:hover, .password-toggle:focus-visible { opacity: 1; }
  .password-toggle:focus-visible { outline: 2px solid currentColor; outline-offset: 2px; border-radius: 6px; }

  /* Paired with the has-session class set in the head script above: applies
     as soon as these elements are inserted, before script.js finishes its
     real auth check, so refreshing while logged in never shows a flash of the
     auth screen. !important matches .hidden's own specificity.
     When a conversation was open (has-open-chat), pre-paint the chat screen
     instead of the chats list, so refreshing inside a chat stays in that
     chat instead of flashing the list before script.js switches screens. */
  html.has-session #auth-screen { display: none !important; }
  html.has-session:not(.has-open-chat) #chats-screen.hidden { display: flex !important; }
  html.has-session.has-open-chat #chat-screen.hidden { display: flex !important; }
</style>
</head>
<body>

  <!-- AUTH SCREEN -->
  <div id="auth-screen" class="screen">
    <div class="auth-card">
      <h1 class="auth-title">Circle</h1>
      <p class="auth-sub">One group. Everyone's in it.</p>

      <form id="auth-form">
        <input id="auth-fullname" class="hidden" type="text" placeholder="Name" autocomplete="name" maxlength="20" />
        <input id="auth-name" type="text" placeholder="Username" autocomplete="username" minlength="5" maxlength="10" required />
        <div class="password-field">
          <input id="auth-password" type="password" placeholder="Password" autocomplete="current-password" minlength="8" maxlength="20" required />
          <button type="button" id="password-toggle" class="password-toggle" aria-label="Show password" aria-pressed="false">
            <svg id="password-toggle-icon" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"></path>
              <circle cx="12" cy="12" r="3"></circle>
            </svg>
          </button>
        </div>
        <button type="submit" id="auth-submit">Sign in</button>
      </form>

      <button id="auth-toggle" class="link-button">Need an account? Sign up</button>
      <p id="auth-error" class="auth-error"></p>
    </div>
  </div>

  <!-- CHATS LIST SCREEN -->
  <div id="chats-screen" class="screen hidden">
    <header class="chat-header">
      <div class="chat-header-info">
        <span class="chat-title">Chats</span>
      </div>
      <div class="header-actions">
        <button type="button" id="settings-button" class="icon-button" aria-label="Settings">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09a1.65 1.65 0 0 0-1-1.51 1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09a1.65 1.65 0 0 0 1.51-1 1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33h.01a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51h.01a1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82v.01a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1Z"/></svg>
        </button>
        <button type="button" id="theme-toggle" class="icon-button" aria-label="Toggle theme">
          <svg id="theme-icon" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg>
        </button>
        <button id="sign-out" class="icon-button" aria-label="Sign out">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18.36 6.64a9 9 0 1 1-12.73 0"/><line x1="12" y1="2" x2="12" y2="12"/></svg>
        </button>
      </div>
    </header>

    <div class="search-bar">
      <input id="user-search" type="search" placeholder="Search username…" autocomplete="off" aria-label="Search users by username" />
      <div id="search-results" class="search-results hidden"></div>
    </div>

    <main id="chat-list" class="chat-list"></main>
  </div>

  <!-- CHAT SCREEN -->
  <div id="chat-screen" class="screen hidden">
    <header class="chat-header">
      <button type="button" id="back-button" class="icon-button" aria-label="Back to chats">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
      </button>
      <div class="chat-header-info">
        <span class="chat-title" id="chat-partner-name">…</span>
        <span class="chat-sub hidden" id="typing-indicator"></span>
      </div>
    </header>

    <main id="message-list" class="message-list"></main>

    <div id="jump-bottom" class="jump-bottom hidden" aria-label="Jump to latest messages">↓ <span id="jump-bottom-count"></span></div>

    <div id="reply-preview" class="reply-preview hidden">
      <div class="reply-preview-info">
        <span id="reply-preview-name" class="reply-preview-name"></span>
        <span id="reply-preview-text" class="reply-preview-text"></span>
      </div>
      <button type="button" id="reply-preview-cancel" class="icon-button" aria-label="Cancel reply">✕</button>
    </div>

    <p id="composer-error" class="composer-error hidden" role="alert"></p>

    <form id="composer" class="composer">
      <button type="button" id="attach-button" class="icon-button" aria-label="Attach media">📎</button>
      <input id="attach-input" type="file" accept="image/*" class="hidden-field" />
      <input id="message-input" type="text" placeholder="Message" autocomplete="off" />
      <button type="submit" id="send-button" class="send-button" aria-label="Send">➤</button>
    </form>

  </div>

  <!-- SETTINGS MODAL (top-level: openable from both the chats list and a
       conversation, neither of which is an ancestor of both screens) -->
  <div id="settings-overlay" class="settings-overlay hidden" role="dialog" aria-modal="true" aria-labelledby="settings-title">
      <div class="settings-card">
        <h2 id="settings-title">Settings</h2>
        <label class="settings-label" for="settings-name">Your name</label>
        <p class="settings-hint">Shown above the messages you send. Your username (what you sign in with) stays the same.</p>
        <input id="settings-name" type="text" maxlength="20" autocomplete="nickname" />
        <p id="settings-error" class="auth-error"></p>
        <div class="settings-actions">
          <button type="button" id="settings-cancel" class="link-button">Cancel</button>
          <button type="button" id="settings-save">Save</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="/supabase-config.js"></script>
  <script src="/script.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Circle</title>
<link rel="manifest" href="/manifest.json" />
<meta name="theme-color" content="#0E1116" />
<link rel="stylesheet" href="/style.css" />
</head>
<body>

  <!-- AUTH SCREEN -->
  <div id="auth-screen" class="screen">
    <div class="auth-card">
      <h1 class="auth-title">Circle</h1>
      <p class="auth-sub">One group. Everyone's in it.</p>

      <form id="auth-form">
        <input id="auth-name" type="text" placeholder="Username (5–10 characters)" autocomplete="username" minlength="5" maxlength="10" required />
        <input id="auth-password" type="password" placeholder="Password (8–20 chars, mixed case, number, symbol)" autocomplete="current-password" minlength="8" maxlength="20" required />
        <button type="submit" id="auth-submit">Sign in</button>
      </form>

      <button id="auth-toggle" class="link-button">Need an account? Sign up</button>
      <p id="auth-error" class="auth-error"></p>
    </div>
  </div>

  <!-- CHAT SCREEN -->
  <div id="chat-screen" class="screen hidden">
    <header class="chat-header">
      <div class="chat-header-info">
        <span class="chat-title">Circle</span>
        <span class="chat-sub" id="member-count">—</span>
      </div>
      <button id="sign-out" class="icon-button" aria-label="Sign out">⏻</button>
    </header>

    <main id="message-list" class="message-list"></main>

    <form id="composer" class="composer">
      <button type="button" id="attach-button" class="icon-button" aria-label="Attach media">📎</button>
      <input id="attach-input" type="file" accept="image/*" class="hidden-field" />
      <input id="message-input" type="text" placeholder="Message" autocomplete="off" />
      <button type="submit" id="send-button" class="send-button" aria-label="Send">➤</button>
    </form>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="/supabase-config.js"></script>
  <script src="/script.js"></script>
</body>
</html>
